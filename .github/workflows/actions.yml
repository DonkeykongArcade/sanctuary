name: run getEpgsall.py

on:
  workflow_dispatch:
  schedule:
    - cron: "0 09 * * *" # Runs daliy at 09:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Prevents permission issues when pushing and clearing runs
    permissions:
      contents: write
      actions: write

    steps:
      - name: checkout repo content
        uses: actions/checkout@v4 # Updated to v4 (Node 20+)

      - name: setup python
        uses: actions/setup-python@v5 # Updated to v5 (Node 20+)
        with:
          python-version: '3.10'
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: execute py script
        run: python -c "import os; os.chdir('.generateEPG'); import getEpgsall" 
          
      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "update epg" --allow-empty)
          
      - name: push changes
        run: |
          git push origin main # Nativer Push ohne fehlerhafte Drittanbieter-Action

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
