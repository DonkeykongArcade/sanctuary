name: run getEpgsall.py

on:
  schedule:
    - cron: '0 8 * * *' # every day at 08:00am

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v2 # checkout the repository content to github runner

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # install the python version needed
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: execute py script # run getEpgsall.py
        env:
          SOME_SECRET: ${{ secrets.SOME_SECRET }}
        run: python -c "import os; os.chdir('.generateEPG'); import getEpgsall" 
          
      - name: commit files
        run: |
          git config --local user.email "frank.ockenfeld@gmx.de"
          git config --local user.name "DonkeykongArcade"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "updated epg" --allow-empty)
          
      - name: push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main 